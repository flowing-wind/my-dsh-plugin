- insert:
    - id: usage-billing
      name: '@deepseek-ai/dsh-experimental-usage-billing'
      config:
        apiKeyEnv: DEEPSEEK_API_KEY
        balanceUrl: https://api.deepseek.com/user/balance
        balanceCacheMs: 60000
        requestTimeoutMs: 15000
        refreshMs: 15000
        generations:
          - provider: deepseek-official
            effectiveAt: !!js Date.parse('2026-09-21T00:00:00+08:00')
            holidays: ['2026-09-25', '2026-09-26', '2026-09-27', '2026-10-01', '2026-10-02', '2026-10-03', '2026-10-04', '2026-10-05', '2026-10-06', '2026-10-07']
            models:
              deepseek-flash: &flash
                peak: { input: 2, cacheRead: 0.04, output: 8 }
                offPeak: { input: 1, cacheRead: 0.02, output: 4 }
              deepseek-v4-flash: *flash
              deepseek-v4-flash-vision-exp: *flash
              deepseek-v4-pro:
                peak: { input: 9, cacheRead: 0.30, output: 27 }
                offPeak: { input: 4.5, cacheRead: 0.15, output: 13.5 }
