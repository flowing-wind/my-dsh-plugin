- id: session-controller
  config:
    nativeOpen: false
    defaultCwd: /home/dsh/Projects
- id: workspace-controller
  config:
    documentsDirectory: /home/dsh/Projects
- id: permission
  config:
    presets:
      read-only:
        sandbox: read-only
        approval: ask
      workspace-write:
        sandbox: workspace-write
        approval: ask
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: ui-open-in-app
  disabled: true

- id: page-login
  config:
    passwordHash: !!js process.env.DSH_PAGE_PASSWORD_HASH
    idleMs: 3600000
    attemptsPerMinute: 10
- id: personal-instructions
  config:
    path: /home/dsh/.dsh/agent.md
    maxBytes: 131072

- id: workspace-management
  config:
    managedWorkspaceRoot: /home/dsh/Projects
- id: workspace-download
  config:
    archiveDirectory: /home/dsh/.dsh/download-cache

- id: connection
  config:
    trustedHosts: ['dsh.flowing-wind.space']
