<VirtualHost *:80>
  ServerName dsh.flowing-wind.space
  DocumentRoot /var/www/dsh-acme
  <Directory /var/www/dsh-acme>
    Require all granted
  </Directory>
  RewriteEngine On
  RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
  RewriteRule ^ https://dsh.flowing-wind.space%{REQUEST_URI} [R=301,L]
</VirtualHost>
<VirtualHost *:443>
  ServerName dsh.flowing-wind.space
  SSLEngine On
  SSLCertificateFile /etc/letsencrypt/live/dsh.flowing-wind.space/fullchain.pem
  SSLCertificateKeyFile /etc/letsencrypt/live/dsh.flowing-wind.space/privkey.pem
  ProxyPreserveHost On
  ProxyRequests Off
  RequestHeader set X-Forwarded-Proto "https"
  ProxyPass / http://127.0.0.1:3080/ upgrade=websocket
  ProxyPassReverse / http://127.0.0.1:3080/
  ErrorLog ${APACHE_LOG_DIR}/dsh-error.log
  CustomLog ${APACHE_LOG_DIR}/dsh-access.log "%h %t %m %U %>s %b"
</VirtualHost>
